[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lto-backup"
version = "1.1.0"
description = "File-based records management system backup application for LTO tapes"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lto-backup = "lto_backup.cli.main:main"
lto-restore = "lto_backup.cli.restore:restore_main"

[tool.hatch.build.targets.wheel]
packages = ["src/lto_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lto_backup"]
